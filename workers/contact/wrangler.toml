name = "aeropolimento-contact"
main = "src/index.ts"
compatibility_date = "2026-04-17"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Envio de e-mail nativo da Cloudflare (Email Sending). Sem API key: a autorização
# vem do domínio onboardado na conta (Compute & AI > Email Service > Email Sending,
# ou `wrangler email sending enable aeropolimentoprodutos.com.br`).
[[send_email]]
name = "EMAIL"

# Variáveis públicas (não-secretas).
[vars]
# Destino dos leads dos dois formulários.
CONTACT_TO_EMAIL = "aeropolimentoprodutos@gmail.com"
# Opcional: destino separado para solicitações de revenda (cai em CONTACT_TO_EMAIL se vazio).
# RESELLER_TO_EMAIL = "aeropolimentoprodutos@gmail.com"
# Remetente: precisa ser um endereço no domínio onboardado (aeropolimentoprodutos.com.br).
EMAIL_FROM = "formulario@aeropolimentoprodutos.com.br"
EMAIL_FROM_NAME = "Site Aeropolimento"

# Rate-limit por IP é opcional. Para ativar, crie um KV e descomente:
#   wrangler kv namespace create CONTACT_RATELIMIT
# [[kv_namespaces]]
# binding = "CONTACT_RATELIMIT"
# id = "<id-gerado-pelo-comando-acima>"
